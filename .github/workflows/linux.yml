name: Linux build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install X11 runtime and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-xinput0 fonts-noto-cjk xvfb xauth
      - run: python -m pip install -r requirements-dev.txt -r requirements-background.txt
      - name: Install offline foreground model for AI-enabled package
        run: python pet_images.py --download-model --model-dir models
      - name: Check xcb shared library dependencies
        run: |
          plugin=$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')
          dependencies=$(ldd "$plugin")
          printf "%s\n" "$dependencies"
          if [[ "$dependencies" == *"not found"* ]]; then exit 1; fi
      - name: Verify physics, interactions and native X11 window detection
        run: xvfb-run -a -s "-screen 0 1280x800x24" env QT_QPA_PLATFORM=xcb python -m unittest test_physics test_naiwa test_linux_desktop test_ubuntu test_pet_images -q
      - name: Download independent photo fixture
        run: python scripts/download-test-photo.py
      - name: Build Linux executable
        run: python -m PyInstaller --noconfirm --workpath build/linux packaging/Naiwa-Linux.spec
      - name: Verify packaged Linux application on X11
        run: xvfb-run -a -s "-screen 0 1280x800x24" python verify_linux.py dist/Why-the-Mouse-Jump-Onto-My-Head-67/Why-the-Mouse-Jump-Onto-My-Head-67 work/inference-photo.jpg
      - name: Create Linux download
        run: |
          cp README.md UBUNTU.md LICENSE THIRD_PARTY.md start.sh linux_setup.py linux_desktop.py project_info.py enable-background-removal.sh requirements-background.txt dist/Why-the-Mouse-Jump-Onto-My-Head-67/
          cp -R gnome-extension dist/Why-the-Mouse-Jump-Onto-My-Head-67/
          chmod +x dist/Why-the-Mouse-Jump-Onto-My-Head-67/Why-the-Mouse-Jump-Onto-My-Head-67 dist/Why-the-Mouse-Jump-Onto-My-Head-67/start.sh
          tar -C dist -czf dist/Why-the-Mouse-Jump-Onto-My-Head-67-Linux-x64.tar.gz Why-the-Mouse-Jump-Onto-My-Head-67
      - uses: actions/upload-artifact@v4
        with:
          name: Why-the-Mouse-Jump-Onto-My-Head-67-Linux-x64
          path: |
            dist/Why-the-Mouse-Jump-Onto-My-Head-67-Linux-x64.tar.gz
            verification/linux-startup.json
            verification/linux-control-room.png

