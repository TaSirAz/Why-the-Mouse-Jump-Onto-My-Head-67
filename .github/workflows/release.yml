name: Publish v1.2.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v1.2.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for successful builds of this release commit
        id: builds
        run: |
          test "$GITHUB_REF" = refs/heads/main
          for platform in linux windows; do
            build_id=
            for attempt in $(seq 1 80); do
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$platform.yml/runs?branch=main&per_page=10" --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push") | [.id,.status,(.conclusion // "pending")] | @tsv' | head -n 1)
              if [ -n "$result" ]; then
                read -r build_id status conclusion <<< "$result"
                if [ "$status" = completed ]; then
                  test "$conclusion" = success || { echo "$platform build failed: $conclusion"; exit 1; }
                  break
                fi
              fi
              sleep 15
            done
            test -n "$build_id" && test "$status" = completed && test "$conclusion" = success
            echo "$platform=$build_id" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/download-artifact@v4
        with:
          name: Why-the-Mouse-Jump-Onto-My-Head-67-Linux-x64
          run-id: ${{ steps.builds.outputs.linux }}
          github-token: ${{ github.token }}
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: Why-the-Mouse-Jump-Onto-My-Head-67-Windows-x64
          run-id: ${{ steps.builds.outputs.windows }}
          github-token: ${{ github.token }}
          path: release/windows
      - name: Prepare current guides and portable downloads
        run: |
          package=Why-the-Mouse-Jump-Onto-My-Head-67
          mkdir -p release/staging
          mapfile -t archives < <(find release/linux -type f -name "$package-Linux-x64.tar.gz")
          test "${#archives[@]}" = 1
          tar -xzf "${archives[0]}" -C release/staging
          cp README.md UBUNTU.md "release/staging/$package/"
          tar -C release/staging -czf "release/$package-Linux-x64.tar.gz" "$package"
          mapfile -t executables < <(find release/windows -type f -name "$package.exe")
          test "${#executables[@]}" = 1
          mkdir -p release/windows-portable
          cp "${executables[0]}" release/windows-portable/
          cp README.md LICENSE THIRD_PARTY.md release/windows-portable/
          cp -R licenses release/windows-portable/
          (cd release/windows-portable && zip -qr "../$package-Windows-x64.zip" .)
          cp UBUNTU.md release/UBUNTU.md
      - name: Publish release with both tested binaries
        run: |
          cat > release/notes.md <<'NOTES'
          **GNOME Wayland window interaction** for Why-the-Mouse-Jump-Onto-My-Head-67.

          - A read-only GNOME Shell extension supplies native Wayland window geometry to the desktop pet.
          - Pets land on native windows, interact with their edges, and release supports when windows minimize or close.
          - Portable app settings no longer redirect GNOME extension and desktop shortcut installation to the app's private data directory.
          - Setup distinguishes installed files from a connected bridge. Existing pet processes reconnect automatically after the extension is enabled.
          - Monitor mapping rejects ambiguous multi-monitor coordinates and falls back to X11 with an explicit status instead of producing incorrect collisions.

          **First installation on GNOME 45–50:** extract the Linux archive, run `bash start.sh --install-gnome-bridge`, save work and log out/in if GNOME has not discovered the extension, then run `gnome-extensions enable window-geometry@desktoppets.local`. Run `bash start.sh --doctor` and confirm `GNOME bridge: connected`.

          The pet continues to use XWayland for its transparent overlay. Native window geometry is provided by the GNOME extension. Other Wayland compositors need their own integration; X11/XWayland fallback remains available.

          Linux and Windows downloads retain the hamster default and offline AI PNG/JPG imports.

          NOTES
          if gh release view v1.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.2.1 release/*-Linux-x64.tar.gz release/*-Windows-x64.zip release/UBUNTU.md --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.2.1 --title "Why-the-Mouse-Jump-Onto-My-Head-67 v1.2.1" --notes-file release/notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2.1 release/*-Linux-x64.tar.gz release/*-Windows-x64.zip release/UBUNTU.md --target "$GITHUB_SHA" --title "Why-the-Mouse-Jump-Onto-My-Head-67 v1.2.1" --notes-file release/notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
