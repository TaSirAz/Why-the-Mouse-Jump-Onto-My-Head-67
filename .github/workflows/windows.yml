name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify physics and interactions
        run: python -m unittest test_naiwa -q
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Naiwa --icon assets/naiwa.ico --add-data "assets;assets" naiwa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Naiwa-Windows-x64
          path: |
            dist/Naiwa.exe
            README.md
            LICENSE
            THIRD_PARTY.md
